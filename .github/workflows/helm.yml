name: Helm Chart

on:
  pull_request:
    branches: [main, "stack/**"]
  push:
    branches: [main]

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: "0.7.0"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # A single static binary, no cluster and no package-manager
      # bootstrap needed. Pinned to the version verified locally. yq is
      # already preinstalled on ubuntu-latest (actions/runner-images).
      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Lint, template, validate and assert
        run: charts/nanoidp/ci/check.sh
